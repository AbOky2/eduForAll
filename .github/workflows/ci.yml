name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lancement à la main (Actions → CI → Run workflow) : rejoue la qualité et,
  # seulement dans ce cas, le build preview ci-dessous. Sans ce déclencheur, le
  # job preview-build ne pouvait jamais tourner. Builds de production et envoi
  # en test : workflow « Release EAS » (release-eas.yml).
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installation verrouillée
        run: npm ci
      - name: Dépendances saines
        run: npm audit --omit=dev --audit-level=high || true
      - name: Lint
        run: npx expo lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test -- --ci
      - name: Validation contenu
        run: npm run validate:content
      - name: Validation assets
        run: npm run validate:assets
      - name: Validation audio
        run: npm run validate:audio
      # Verdict faisant foi : rejoue les vérifications ci-dessus et y ajoute
      # expo-doctor et la gate anti-SDK tiers, en tenant compte des exceptions
      # explicitement acceptées (release-acceptances.json). Les étapes
      # granulaires au-dessus servent à échouer vite et clairement.
      - name: Gates de release
        run: npm run validate:release
      # `all` = les plateformes déclarées dans app.config.ts, donc iOS et
      # Android. Sans cette déclaration, l'export partait aussi sur le web,
      # absent du projet, et échouait sans rien produire — en sortant en 0.
      - name: Export de contrôle (bundle Metro)
        run: npx expo export --platform all --output-dir /tmp/export-check

  # Build preview EAS : déclenchement manuel uniquement (jamais auto en prod)
  preview-build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: EAS build preview
        run: npx eas-cli build --profile preview --platform android --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_NO_TELEMETRY: '1'
          DISABLE_EAS_ANALYTICS: '1'
