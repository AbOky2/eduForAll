# Premier lancement (à exécuter en mode avion) : onboarding → profil → accueil.
# appId : celui du profil de build utilisé (dev / preview / production).
appId: td.ecolna.app.dev
---
- launchApp:
    clearState: true

# Onboarding 1/3
- assertVisible: 'Ton école t’accompagne partout.'
- tapOn: 'Commencer'

# Onboarding 2/3 — les quatre disciplines de la grille officielle du CP
- assertVisible: 'Langage, lecture, écriture et calcul.'
- assertVisible: 'Langage'
- assertVisible: 'Lecture'
- assertVisible: 'Écriture'
- assertVisible: 'Calcul'
- tapOn: 'Suivant'

# Onboarding 3/3 — la promesse hors connexion
- assertVisible: 'Fonctionne sans connexion.'
- tapOn: 'Créer mon profil'

# Création du profil — la cérémonie en trois étapes (brief v2 § 12) :
# personnage, prénom, classe ; jamais de bouton grisé, une aide douce à la place.
- assertVisible: 'Choisis ton personnage'
- tapOn: 'C’est moi !'
- assertVisible: 'Touche le personnage qui te ressemble.'
- tapOn: 'Avatar 2.*'
- tapOn: 'C’est moi !'

# Le prénom : écrit par un adulte, il ne quitte jamais l'appareil
- assertVisible: 'Comment tu t’appelles.*'
- assertVisible: 'Le prénom reste sur cet appareil. Pas de compte, pas d’e-mail, rien n’est envoyé.'
- tapOn: 'Écris ton prénom ici'
- inputText: 'Amina'
- hideKeyboard
- tapOn: 'C’est mon prénom !'

# La classe
- assertVisible: 'Tu es dans quelle classe.*'
- tapOn: 'CP1.*'
- tapOn: 'C’est parti !'

# La bienvenue, puis l'accueil
- assertVisible: 'Bienvenue, Amina.*'
- tapOn: 'On y va !'

# Accueil enfant : les quatre disciplines sont ouvertes dès le premier jour
- assertVisible: 'Bonjour Amina !'
- assertVisible: 'Tes activités'
- assertVisible: 'Langage.*'
- assertVisible: 'Calcul.*'
