# Couper le son depuis l'espace parent, et vérifier la persistance.
appId: td.ecolna.app.dev
---
- launchApp
- tapOn: 'Parents'
# 7 × 6 = 42
- tapOn: 'Pour entrer, écris le résultat de cette opération :'
- inputText: '42'
- hideKeyboard
- tapOn: 'Entrer'
- assertVisible: 'Tableau de bord'
- tapOn: 'Paramètres'
- assertVisible: 'Son'
- tapOn: 'Son'
- stopApp
- launchApp
- tapOn: 'Parents'
- tapOn: 'Pour entrer, écris le résultat de cette opération :'
- inputText: '42'
- hideKeyboard
- tapOn: 'Entrer'
- tapOn: 'Paramètres'
- assertVisible: 'Son'
