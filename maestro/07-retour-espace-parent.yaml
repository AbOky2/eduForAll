# Régression : le retour depuis l'espace parent ramenait à la porte parentale
# au lieu de l'accueil. « Parents » était un onglet dont l'écran repoussait la
# porte à chaque reprise de focus — boucle infinie, bouton retour mort.
appId: td.ecolna.app.dev
---
- launchApp
- assertVisible: 'Bonjour.*'

- tapOn: 'Parents'
- assertVisible: 'Espace parents'
# L'opération est tirée au hasard : le sous-parcours la lit et la calcule.
- runFlow: subflows/passer-la-porte-parentale.yaml

# Le retour doit ramener à l'accueil enfant, en un seul geste
- tapOn: 'Retour'
- assertVisible: 'Bonjour.*'
- assertNotVisible: 'Espace parents'
- assertVisible: 'Tes activités'
