# Tuer l'app en pleine leçon puis vérifier la reprise à l'étape sauvegardée.
appId: td.alifa.app.dev
---
- launchApp
- tapOn: 'Ma prochaine leçon'
- assertVisible: 'Exercice 1 sur 6'
- tapOn:
    index: 0
    point: '50%,70%'
- assertVisible: 'Exercice 2 sur 6'
- stopApp

- launchApp
# La leçon entamée est proposée en reprise, pas en démarrage
- assertVisible: 'Continuer ma leçon'
- tapOn: 'Continuer ma leçon'
# On reprend où l'on s'était arrêté, pas au début
- assertNotVisible: 'Exercice 1 sur 6'
