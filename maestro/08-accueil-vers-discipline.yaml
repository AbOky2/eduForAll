# Régression : depuis l'accueil, toucher une discipline ouvrait l'onglet
# « Apprendre » et obligeait à la choisir une seconde fois.
appId: td.ecolna.app.dev
---
- launchApp
- assertVisible: 'Tes activités'

# Toucher « Langage » doit ouvrir la carte de progression du langage,
# pas la liste des modules
# La tuile se lit « Langage, 12 sur 45 » : on vise son début.
- tapOn: 'Langage.*'
- assertNotVisible: 'Choisis ton module'
- assertVisible: 'Retour'
