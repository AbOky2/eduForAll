# L'espace parent est protégé : une mauvaise réponse ne passe pas.
appId: td.ecolna.app.dev
---
- launchApp
- tapOn: 'Parents'
- assertVisible: 'Espace parents'
- assertVisible: 'Pour entrer, réponds à cette question :'
# 7 × 6 : la réponse se saisit, elle ne se choisit plus
- tapOn: 'Pour entrer, écris le résultat de cette opération :'
- inputText: '36'
- tapOn: 'Entrer'
- assertVisible: 'Ce n’est pas la bonne réponse.'
- assertNotVisible: 'Tableau de bord'
