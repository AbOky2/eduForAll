       (scripts/tools/render-brand-assets.mjs), pas embarquée ici. -->
  <rect width="1024" height="500" fill="#1f5473"/>
  <g transform="translate(286 250) scale(0.26) translate(-512 -512)">
    <path d="M512 370 C444 300 344 286 256 294 L256 740 C344 732 444 746 512 816 Z" fill="#fbf3e4"/>
