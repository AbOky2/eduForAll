  </g>
  <text x="400" y="232" font-family="Quicksand" font-size="82" font-weight="700"
        fill="#fbf3e4" letter-spacing="8">ECOLNA</text>
  <text x="404" y="294" font-family="Quicksand" font-size="30" font-weight="600"
        fill="#e0b184">Le programme officiel du CP.</text>
  <text x="404" y="336" font-family="Quicksand" font-size="30" font-weight="600"
