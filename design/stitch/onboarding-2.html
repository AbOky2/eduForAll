<body class="min-h-screen flex flex-col items-center justify-between font-body-md text-body-md text-on-surface">
<!-- Top App Bar (Modified for Onboarding Context - No navigation, just branding/skip) -->
<header class="w-full top-0 sticky bg-surface/80 backdrop-blur-md flex justify-between items-center px-margin-mobile py-4 z-50">
<div class="font-headline-lg-mobile text-headline-lg-mobile text-primary">ALIFA</div>
<button class="font-label-lg text-label-lg text-outline p-2 hover:bg-surface-container-low rounded-full transition-colors">
            Passer
        </button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-md mx-auto px-margin-mobile flex flex-col justify-center items-center gap-stack-lg py-stack-lg">
<!-- Onboarding Message -->
<div class="text-center space-y-stack-sm w-full">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-secondary-container text-on-secondary-container mb-4 shadow-[0_4px_12px_rgba(61,64,91,0.08)]">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Lecture, dictée, écriture et calcul.</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] mx-auto">Tout ce dont tu as besoin pour apprendre en t'amusant.</p>
</div>
<!-- Bento Grid / Cards -->
<div class="grid grid-cols-2 gap-gutter-mobile w-full">
<!-- Card 1: Lecture -->
<div class="bg-surface-container-lowest rounded-3xl p-6 flex flex-col items-center justify-center gap-4 shadow-[0_4px_12px_rgba(61,64,91,0.08)] border border-outline-variant/30 aspect-square relative overflow-hidden group">
<div class="absolute inset-0 bg-primary-container/10 transform scale-0 rounded-full transition-transform duration-300 group-hover:scale-150 origin-center"></div>
<div class="w-14 h-14 rounded-2xl bg-secondary-fixed flex items-center justify-center text-on-secondary-fixed-variant shadow-inner relative z-10">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">menu_book</span>
</div>
<span class="font-label-lg text-label-lg text-on-surface relative z-10">Lecture</span>
</div>
<!-- Card 2: Écriture -->
<div class="bg-surface-container-lowest rounded-3xl p-6 flex flex-col items-center justify-center gap-4 shadow-[0_4px_12px_rgba(61,64,91,0.08)] border border-outline-variant/30 aspect-square relative overflow-hidden group">
<div class="absolute inset-0 bg-tertiary-container/10 transform scale-0 rounded-full transition-transform duration-300 group-hover:scale-150 origin-center"></div>
<div class="w-14 h-14 rounded-2xl bg-tertiary-fixed text-on-tertiary-fixed flex items-center justify-center shadow-inner relative z-10">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">edit</span>
</div>
<span class="font-label-lg text-label-lg text-on-surface relative z-10">Écriture</span>
</div>
<!-- Card 3: Dictée -->
<div class="bg-surface-container-lowest rounded-3xl p-6 flex flex-col items-center justify-center gap-4 shadow-[0_4px_12px_rgba(61,64,91,0.08)] border border-outline-variant/30 aspect-square relative overflow-hidden group">
<div class="absolute inset-0 bg-primary-container/10 transform scale-0 rounded-full transition-transform duration-300 group-hover:scale-150 origin-center"></div>
<div class="w-14 h-14 rounded-2xl bg-primary-container text-on-primary-container flex items-center justify-center shadow-inner relative z-10">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">hearing</span>
</div>
<span class="font-label-lg text-label-lg text-on-surface relative z-10">Dictée</span>
</div>
<!-- Card 4: Calcul -->
<div class="bg-surface-container-lowest rounded-3xl p-6 flex flex-col items-center justify-center gap-4 shadow-[0_4px_12px_rgba(61,64,91,0.08)] border border-outline-variant/30 aspect-square relative overflow-hidden group">
<div class="absolute inset-0 bg-secondary-container/10 transform scale-0 rounded-full transition-transform duration-300 group-hover:scale-150 origin-center"></div>
<div class="w-14 h-14 rounded-2xl bg-secondary text-on-secondary flex items-center justify-center shadow-inner relative z-10">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">calculate</span>
</div>
<span class="font-label-lg text-label-lg text-on-surface relative z-10">Calcul</span>
</div>
</div>
<!-- Progress Indicators -->
<div class="flex gap-2 justify-center mt-4">
<div class="w-2 h-2 rounded-full bg-outline-variant"></div>
<div class="w-8 h-2 rounded-full bg-primary-container"></div>
<div class="w-2 h-2 rounded-full bg-outline-variant"></div>
</div>
</main>
<!-- Bottom Action Area (Transactional, no global nav shell) -->
<div class="w-full px-margin-mobile pb-stack-lg pt-4 bg-transparent max-w-md mx-auto">
<button class="w-full min-h-touch-target-min bg-primary-container text-on-primary-container font-label-lg text-label-lg rounded-2xl flex items-center justify-center shadow-[0_4px_0_#A87B4C] active:shadow-none active:translate-y-[4px] transition-all relative overflow-hidden">
<span class="relative z-10">Suivant</span>
<div class="absolute inset-0 bg-white/20 transform scale-x-0 group-hover:scale-x-100 transition-transform origin-left"></div>
</button>
</div>
