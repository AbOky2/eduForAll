<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Paramètres - ALIFA</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "inverse-primary": "#f0bd8b",

                        "on-surface-variant": "#50453b",
                        "primary-fixed-dim": "#f0bd8b",
                        "on-tertiary-container": "#533d00",
                        "on-primary": "#ffffff",
                        "tertiary-fixed": "#ffdf9b",
                        "surface": "#fbf8ff",
                        "surface-dim": "#d6d8f9",
                        "on-surface": "#161a32",
                        "error-container": "#ffdad6",
                        "primary-container": "#d4a373",
                        "secondary": "#2b6485",
                        "secondary-fixed-dim": "#98cdf2",
                        "surface-container": "#edecff",
                        "inverse-on-surface": "#f1efff",

                        "tertiary": "#785a00",

                    "spacing": {

                        "margin-mobile": "24px",
                        "stack-md": "24px",
                        "gutter-mobile": "16px",
                        "base": "8px"
                    },
                    "fontFamily": {
                        "label-lg": ["Plus Jakarta Sans"],
                        "label-md": ["Plus Jakarta Sans"],

<style>
        body {
            background-color: #F4F1DE; /* Ivory tone */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-surface min-h-screen pb-touch-target-min md:pb-0">
<!-- TopAppBar -->
<header class="bg-surface w-full top-0 sticky flex justify-between items-center px-margin-mobile py-4 w-full shadow-sm z-40">
<div class="flex items-center gap-4">
<button aria-label="Retour" class="text-primary hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-3xl">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary font-bold tracking-tight">Paramètres</h1>
</div>
<button aria-label="Cloud sync off" class="text-primary hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-2xl">cloud_off</span>
</button>
</header>
<main class="px-margin-mobile py-stack-md max-w-2xl mx-auto flex flex-col gap-stack-md">
<!-- Settings Container -->
<div class="bg-surface-container-lowest rounded-xl border border-outline-variant/30 overflow-hidden shadow-[0_4px_12px_rgba(61,64,91,0.08)]">
<!-- Son (Toggle) -->
<div class="flex items-center justify-between p-4 border-b border-surface-container min-h-touch-target-min">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary text-2xl">volume_up</span>
<span class="font-body-lg text-body-lg text-on-surface">Son</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-14 h-7 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-0.5 after:left-[4px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-primary-container"></div>
</label>
</div>
<!-- Langue -->
<div class="flex flex-col p-4 border-b border-surface-container gap-3 min-h-touch-target-min">
<div class="flex items-center gap-3 mb-2">
<span class="material-symbols-outlined text-primary text-2xl">language</span>
<span class="font-body-lg text-body-lg text-on-surface">Langue</span>
</div>
<div class="flex flex-col gap-2 pl-9">
<label class="flex items-center gap-3 cursor-pointer p-2 rounded-lg hover:bg-surface-container-low transition-colors min-h-[48px]">
<input checked="" class="w-6 h-6 text-primary-container bg-surface border-outline focus:ring-primary-container" name="language" type="radio" value="fr"/>
<span class="font-body-md text-body-md text-on-surface-variant">Français</span>
</label>
<label class="flex items-center gap-3 cursor-pointer p-2 rounded-lg hover:bg-surface-container-low transition-colors min-h-[48px]">
<input class="w-6 h-6 text-primary-container bg-surface border-outline focus:ring-primary-container" name="language" type="radio" value="ar"/>
<span class="font-body-md text-body-md text-on-surface-variant">Arabe tchadien</span>
</label>
</div>
</div>
<!-- Informations offline -->
<div class="flex items-center justify-between p-4 border-b border-surface-container min-h-touch-target-min">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary text-2xl">download_done</span>
<div class="flex flex-col">
<span class="font-body-lg text-body-lg text-on-surface">Informations offline</span>
<span class="font-body-md text-body-md text-on-surface-variant text-sm">Status: Tout est téléchargé</span>
</div>
</div>
<span class="material-symbols-outlined text-secondary text-2xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<!-- À propos du projet -->
<a class="flex items-center justify-between p-4 hover:bg-surface-container-low transition-colors min-h-touch-target-min" href="#">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary text-2xl">info</span>
<span class="font-body-lg text-body-lg text-on-surface">À propos du projet</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</a>
</div>
<!-- Danger Zone -->
<div class="mt-stack-sm flex flex-col items-center">
<button class="w-full flex items-center justify-center gap-2 bg-error-container text-on-error-container font-label-lg text-label-lg rounded-lg min-h-touch-target-min px-6 border-b-4 border-[#ffb4ab] active:border-b-0 active:translate-y-1 transition-all">
<span class="material-symbols-outlined">delete_forever</span>
                Réinitialiser progression
            </button>
</div>
<div class="flex justify-center mt-stack-md opacity-50">
<span class="material-symbols-outlined text-primary" style="font-size: 48px;">forest</span>
</div>
</main>
<!-- Suppress Bottom Navigation on Settings Screen per Semantic Shell Mandate -->
</body></html>
