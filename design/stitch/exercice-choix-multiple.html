<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>

<title>ALIFA - Exercise - Multiple Choice Audio</title>

                        "on-surface-variant": "#50453b",

                        "on-tertiary-container": "#533d00",
                        "on-primary": "#ffffff",
                        "tertiary-fixed": "#ffdf9b",
                        "surface": "#fbf8ff",
                        "surface-dim": "#d6d8f9",

                        "primary-container": "#d4a373",

<style>
        body {
            background-color: #F4F1DE; /* Ivory/Cream background */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.02'/%3E%3C/svg%3E");
        }
        .tactile-shadow {
            box-shadow: 0 4px 12px rgba(61, 64, 91, 0.08);
        }
        .btn-press {
            transition: all 0.15s ease-out;
        }
        .btn-press:active {
            transform: translateY(2px);
            box-shadow: none;
            border-bottom-width: 0px;
            margin-top: 4px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="font-body-md text-on-surface antialiased min-h-screen flex flex-col items-center">
<!-- Top App Bar (Task-Focused - Close Action) -->
<header class="w-full top-0 sticky bg-surface dark:bg-surface-dim flat no shadows flex justify-between items-center px-margin-mobile py-4 w-full z-40 bg-transparent">
<button class="w-touch-target-min h-touch-target-min flex items-center justify-center rounded-full bg-surface-container-lowest shadow-sm text-primary btn-press hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">close</span>
</button>
<div class="flex-1 flex justify-center">
<!-- Progress Beads -->
<div class="flex items-center gap-2">
<div class="w-4 h-4 rounded-full bg-primary-container shadow-sm"></div>
<div class="w-4 h-4 rounded-full bg-primary-container shadow-sm"></div>
<div class="w-4 h-4 rounded-full bg-secondary-fixed shadow-sm"></div>
<div class="w-4 h-4 rounded-full bg-secondary-fixed shadow-sm"></div>
<div class="w-4 h-4 rounded-full bg-secondary-fixed shadow-sm"></div>
</div>
</div>
<div class="w-touch-target-min"></div> <!-- Spacer for centering -->
</header>
<main class="flex-1 w-full max-w-md px-margin-mobile pb-[100px] flex flex-col items-center pt-stack-md">
<!-- Question Section -->
<div class="w-full text-center mb-stack-lg">
<div class="flex items-center justify-center gap-3 mb-stack-md">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Que viens-tu d’entendre ?</h1>
</div>
<!-- Main Audio Button -->
<button class="w-32 h-32 rounded-full bg-primary-container flex items-center justify-center tactile-shadow border-b-[6px] border-[#B58555] mx-auto btn-press hover:bg-opacity-90 group relative">
<span class="material-symbols-outlined text-[64px] text-on-primary-container" style="font-variation-settings: 'FILL' 1;">volume_up</span>
<!-- Subtle decorative rings -->
<div class="absolute inset-0 rounded-full border-4 border-white/20 scale-110 group-hover:scale-125 transition-transform duration-500 opacity-50 group-hover:opacity-0"></div>
</button>
</div>
<!-- Options Section -->
<div class="w-full flex flex-col gap-stack-md">
<!-- Option 1: ba (Correct - Neutral styling as requested, maybe slightly different default shadow) -->
<button class="w-full min-h-[100px] bg-surface-container-lowest rounded-[24px] tactile-shadow border border-outline-variant/30 flex items-center justify-center btn-press hover:bg-surface relative overflow-hidden group">
<span class="font-display-glyph text-display-glyph text-primary">ba</span>
<!-- Decorative subtle element for the 'correct' feeling without being obvious -->
<div class="absolute right-6 top-1/2 -translate-y-1/2 opacity-0 group-focus:opacity-100 transition-opacity">
<div class="w-3 h-3 rounded-full bg-primary-container"></div>
</div>
</button>
<!-- Option 2: ma -->
<button class="w-full min-h-[100px] bg-surface-container-lowest rounded-[24px] tactile-shadow border border-outline-variant/30 flex items-center justify-center btn-press hover:bg-surface relative overflow-hidden group">
<span class="font-display-glyph text-display-glyph text-on-surface-variant">ma</span>
</button>
<!-- Option 3: ta -->
<button class="w-full min-h-[100px] bg-surface-container-lowest rounded-[24px] tactile-shadow border border-outline-variant/30 flex items-center justify-center btn-press hover:bg-surface relative overflow-hidden group">
<span class="font-display-glyph text-display-glyph text-on-surface-variant">ta</span>
</button>
</div>
<!-- Sahelian Decorative Element (Bottom) -->
<div class="mt-auto pt-stack-lg opacity-20 pointer-events-none">
<svg fill="none" height="40" viewbox="0 0 80 40" width="80" xmlns="http://www.w3.org/2000/svg">
<path d="M40 0C62.0914 0 80 17.9086 80 40H0C0 17.9086 17.9086 0 40 0Z" fill="#D4A373"></path>
</svg>
</div>
</main>
<!-- Suppressed Nav Shell since this is a Task-Focused (Linear) Exercise screen with a close button -->
</body></html>
